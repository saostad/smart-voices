[project]
name = "pocket-export"
version = "0.1.0"
description = "Phase 1: export Pocket TTS Farsi v1 to a single ONNX file (tooling only)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "huggingface-hub>=0.35",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.20",
    "pocket-tts>=3.0.2",
    "pocket-tts-onnx @ git+https://github.com/thewh1teagle/pocket-tts-onnx",
    "sentencepiece>=0.2",
    "soundfile>=0.12",
    "torch>=2.4",
]

[tool.uv]
package = false
