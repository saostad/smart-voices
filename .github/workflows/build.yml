name: Build and Release

# Every push and pull request builds and tests on Linux, Windows and macOS.
# Every push to main also publishes a release with all three downloads.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config dpkg-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          scripts/package-deb.sh
          mkdir -p dist tarball
          cp target/smart-voices-linux-amd64.deb dist/
          cp target/release/smart-voices packaging/linux/smart-voices.desktop packaging/linux/README-linux.txt tarball/
          tar -czf dist/smart-voices-linux-x86_64.tar.gz -C tarball smart-voices smart-voices.desktop README-linux.txt

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" packaging\windows\smart-voices.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\installer\smart-voices-windows-x86_64-setup.exe dist\

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/bundle-macos.sh
          scripts/package-dmg.sh
          mkdir -p dist
          cp target/smart-voices-macos-arm64.dmg dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-voices-${{ runner.os }}
          path: dist/*
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: smart-voices-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          TAG="v${VERSION}-build.${{ github.run_number }}"
          gh release create "$TAG" \
            dist/smart-voices-windows-x86_64-setup.exe \
            dist/smart-voices-macos-arm64.dmg \
            dist/smart-voices-linux-amd64.deb \
            dist/smart-voices-linux-x86_64.tar.gz \
            --target "${{ github.sha }}" \
            --title "Smart Voices ${VERSION} (build ${{ github.run_number }})" \
            --notes "Automated build from main (${{ github.sha }}).

          - **Windows:** download \`smart-voices-windows-x86_64-setup.exe\` and run it. Windows SmartScreen may warn because the installer isn't code-signed: click More info → Run anyway.
          - **macOS (Apple Silicon):** download \`smart-voices-macos-arm64.dmg\`, open it, drag Smart Voices into Applications, then right-click the app and choose Open the first time (the app is ad-hoc signed).
          - **Linux (Debian/Ubuntu):** download \`smart-voices-linux-amd64.deb\` and install it with \`sudo apt install ./smart-voices-linux-amd64.deb\`.
          - **Linux (other distros):** download \`smart-voices-linux-x86_64.tar.gz\`, extract, see \`README-linux.txt\`.

          The first reading downloads the voice model (~350 MB, once)."
