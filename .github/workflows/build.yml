name: Build and Release

# Every push and pull request builds and tests on Linux, Windows and macOS.
# Every push to main also publishes a release with all three downloads.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces an unfinished build; on main its release
# includes the same commits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Releases are numbered MAJOR.RUN.0 (e.g. 2.21.0): the major version from
      # Cargo.toml plus this workflow's run number. Stamp it into Cargo.toml after
      # the cache restore so the binary and every package carry the same version.
      - name: Stamp version
        shell: bash
        run: |
          MAJOR="$(sed -n 's/^version = "\([0-9]*\)\..*"/\1/p' Cargo.toml | head -1)"
          VERSION="$MAJOR.${{ github.run_number }}.0" perl -i.bak -pe '$done ||= s/^version = ".*"/version = "$ENV{VERSION}"/' Cargo.toml
          rm Cargo.toml.bak
          grep -m1 '^version = ' Cargo.toml

      - name: Cache ONNX Runtime archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/smart-voices/onnxruntime
          key: onnxruntime-1.28.2-sherpa-1.13.8-${{ runner.os }}

      - name: Fetch pinned ONNX Runtime next to binaries
        shell: bash
        run: scripts/fetch-onnxruntime.sh

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config dpkg-dev cmake libclang-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          scripts/package-deb.sh
          mkdir -p dist tarball
          cp target/smart-voices-linux-amd64.deb dist/
          cp target/release/smart-voices target/release/libonnxruntime.so* packaging/linux/smart-voices.desktop packaging/linux/README-linux.txt tarball/
          tar -czf dist/smart-voices-linux-x86_64.tar.gz -C tarball .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" packaging\windows\smart-voices.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\installer\smart-voices-windows-x86_64-setup.exe dist\

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/bundle-macos.sh
          scripts/package-dmg.sh
          mkdir -p dist
          cp target/smart-voices-macos-arm64.dmg dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-voices-${{ runner.os }}
          path: dist/*
          retention-days: 1

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: smart-voices-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAJOR="$(sed -n 's/^version = "\([0-9]*\)\..*"/\1/p' Cargo.toml | head -1)"
          VERSION="$MAJOR.${{ github.run_number }}.0"
          TAG="v${VERSION}"
          gh release create "$TAG" \
            dist/smart-voices-windows-x86_64-setup.exe \
            dist/smart-voices-macos-arm64.dmg \
            dist/smart-voices-linux-amd64.deb \
            dist/smart-voices-linux-x86_64.tar.gz \
            --target "${{ github.sha }}" \
            --title "Smart Voices ${VERSION}" \
            --notes "Automated build from main (${{ github.sha }}).

          - **Windows:** download \`smart-voices-windows-x86_64-setup.exe\` and run it. Windows SmartScreen may warn because the installer isn't code-signed: click More info → Run anyway.
          - **macOS (Apple Silicon):** download \`smart-voices-macos-arm64.dmg\`, open it, drag Smart Voices into Applications, then right-click the app and choose Open the first time (the app is ad-hoc signed).
          - **Linux (Debian/Ubuntu):** download \`smart-voices-linux-amd64.deb\` and install it with \`sudo apt install ./smart-voices-linux-amd64.deb\`.
          - **Linux (other distros):** download \`smart-voices-linux-x86_64.tar.gz\`, extract, see \`README-linux.txt\`.

          The first reading downloads the voice model (~350 MB, once)."

      - name: Remove temporary artifacts after publishing the release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: context.runId, per_page: 100
            });
            for (const artifact of artifacts) {
              core.info(`Delete published build handoff ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
            }
