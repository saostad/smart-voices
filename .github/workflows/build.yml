name: Build and Release

# Every push and pull request builds and tests on Linux, Windows and macOS.
# Every push to main also publishes a release with all three downloads.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/smart-voices dist/
          cp packaging/linux/smart-voices.desktop packaging/linux/README-linux.txt dist/
          tar -czf smart-voices-linux-x86_64.tar.gz -C dist smart-voices smart-voices.desktop README-linux.txt

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/smart-voices.exe -DestinationPath smart-voices-windows-x86_64.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/bundle-macos.sh
          ditto -c -k --keepParent "target/Smart Voices.app" smart-voices-macos-arm64.zip

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: smart-voices-linux-x86_64
          path: smart-voices-linux-x86_64.tar.gz
          retention-days: 14

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: smart-voices-windows-x86_64
          path: smart-voices-windows-x86_64.zip
          retention-days: 14

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: smart-voices-macos-arm64
          path: smart-voices-macos-arm64.zip
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: smart-voices-linux-x86_64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: smart-voices-windows-x86_64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: smart-voices-macos-arm64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          TAG="v${VERSION}-build.${{ github.run_number }}"
          gh release create "$TAG" \
            dist/smart-voices-windows-x86_64.zip \
            dist/smart-voices-linux-x86_64.tar.gz \
            dist/smart-voices-macos-arm64.zip \
            --target "${{ github.sha }}" \
            --title "Smart Voices ${VERSION} (build ${{ github.run_number }})" \
            --notes "Automated build from main (${{ github.sha }}).

          - **Windows:** download \`smart-voices-windows-x86_64.zip\`, unzip, run \`smart-voices.exe\`.
          - **Linux:** download \`smart-voices-linux-x86_64.tar.gz\`, extract, see \`README-linux.txt\`.
          - **macOS (Apple Silicon):** download \`smart-voices-macos-arm64.zip\`, unzip, move \`Smart Voices.app\` to Applications, then right-click it and choose Open the first time (the app is ad-hoc signed).

          The first reading downloads the voice model (~350 MB, once)."
