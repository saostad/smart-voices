name: Build and Release

# Every push and pull request builds and tests on Linux, Windows and macOS.
# Every push to main also publishes a release with all three downloads.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces an unfinished build; on main its release
# includes the same commits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # sherpa-onnx links shared. Left alone, its build script downloads the runtime
      # libs into target/, where the dependency cache drops them but keeps the build
      # script's result, so a cached build cannot link. Keep them outside target/.
      - name: Choose sherpa-onnx runtime
        id: sherpa
        shell: bash
        run: |
          set -eu
          VERSION="$(grep -A1 '^name = "sherpa-onnx-sys"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          case "$RUNNER_OS" in
            Linux) PLATFORM=linux-x64-shared-lib ;;
            macOS) PLATFORM=osx-arm64-shared-lib ;;
            Windows) PLATFORM=win-x64-shared-MT-Release-lib ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "stem=sherpa-onnx-v$VERSION-$PLATFORM" >> "$GITHUB_OUTPUT"

      - name: Cache sherpa-onnx runtime
        uses: actions/cache@v4
        with:
          path: ~/sherpa-onnx
          key: ${{ steps.sherpa.outputs.stem }}

      - name: Download sherpa-onnx runtime
        shell: bash
        env:
          VERSION: ${{ steps.sherpa.outputs.version }}
          STEM: ${{ steps.sherpa.outputs.stem }}
        run: |
          set -eu
          ROOT="$HOME/sherpa-onnx"
          if [ ! -d "$ROOT/$STEM/lib" ]; then
            mkdir -p "$ROOT"
            curl -fsSL -o "$ROOT/$STEM.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$VERSION/$STEM.tar.bz2"
            tar -xjf "$ROOT/$STEM.tar.bz2" -C "$ROOT"
            rm "$ROOT/$STEM.tar.bz2"
          fi
          LIB="$ROOT/$STEM/lib"
          if [ "$RUNNER_OS" = Windows ]; then LIB="$(cygpath -w "$LIB")"; fi
          echo "SHERPA_ONNX_LIB_DIR=$LIB" >> "$GITHUB_ENV"
          # Windows tests find the DLLs on PATH; Linux and macOS use the rpath.
          echo "$LIB" >> "$GITHUB_PATH"

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config dpkg-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      # The build script only copies the runtime libs next to the binary when it
      # runs, which a cached build skips.
      - name: Put runtime libs next to the binary
        shell: bash
        run: |
          set -eu
          shopt -s nullglob
          for f in "$SHERPA_ONNX_LIB_DIR"/*.so* "$SHERPA_ONNX_LIB_DIR"/*.dylib "$SHERPA_ONNX_LIB_DIR"/*.dll; do
            cp -L "$f" target/release/
          done
          ls target/release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          scripts/package-deb.sh
          mkdir -p dist tarball
          cp target/smart-voices-linux-amd64.deb dist/
          cp target/release/smart-voices target/release/*.so packaging/linux/smart-voices.desktop packaging/linux/README-linux.txt tarball/
          tar -czf dist/smart-voices-linux-x86_64.tar.gz -C tarball .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" packaging\windows\smart-voices.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\installer\smart-voices-windows-x86_64-setup.exe dist\

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/bundle-macos.sh
          scripts/package-dmg.sh
          mkdir -p dist
          cp target/smart-voices-macos-arm64.dmg dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-voices-${{ runner.os }}
          path: dist/*
          retention-days: 1

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: smart-voices-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          TAG="v${VERSION}-build.${{ github.run_number }}"
          gh release create "$TAG" \
            dist/smart-voices-windows-x86_64-setup.exe \
            dist/smart-voices-macos-arm64.dmg \
            dist/smart-voices-linux-amd64.deb \
            dist/smart-voices-linux-x86_64.tar.gz \
            --target "${{ github.sha }}" \
            --title "Smart Voices ${VERSION} (build ${{ github.run_number }})" \
            --notes "Automated build from main (${{ github.sha }}).

          - **Windows:** download \`smart-voices-windows-x86_64-setup.exe\` and run it. Windows SmartScreen may warn because the installer isn't code-signed: click More info → Run anyway.
          - **macOS (Apple Silicon):** download \`smart-voices-macos-arm64.dmg\`, open it, drag Smart Voices into Applications, then right-click the app and choose Open the first time (the app is ad-hoc signed).
          - **Linux (Debian/Ubuntu):** download \`smart-voices-linux-amd64.deb\` and install it with \`sudo apt install ./smart-voices-linux-amd64.deb\`.
          - **Linux (other distros):** download \`smart-voices-linux-x86_64.tar.gz\`, extract, see \`README-linux.txt\`.

          The first reading downloads the voice model (~350 MB, once)."

      - name: Remove temporary artifacts after publishing the release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: context.runId, per_page: 100
            });
            for (const artifact of artifacts) {
              core.info(`Delete published build handoff ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
            }
